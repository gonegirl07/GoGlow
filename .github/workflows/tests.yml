name: Python tests

on:
  push:
    branches: [main, "feat/phase1-prompt-library-preview"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax-check Flow pilot runner
        run: node --check scripts/flow-pilot.mjs
      - name: Syntax-check inline JavaScript in browser app
        run: python scripts/check_inline_js.py app/index.html
      - name: Validate JSON examples
        run: |
          python -m json.tool examples/cycling-36s.json >/dev/null
          python -m json.tool examples/flow-pilot-scene.example.json >/dev/null
          python -m json.tool examples/flow-pilot-selectors.example.json >/dev/null
          python -m json.tool specs/flow-scene.schema.json >/dev/null
      - name: Validate example project
        run: goglow validate examples/cycling-36s.json
      - name: Smoke-test CLI export
        run: goglow export examples/cycling-36s.json --out /tmp/goglow-example.md
