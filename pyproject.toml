[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goglow"
version = "0.1.0"
description = "Provider-neutral AI character video planning and prompt validation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "GoGlow contributors" }]
dependencies = []

[project.scripts]
goglow = "goglow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
